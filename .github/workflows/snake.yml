name: snake
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#3ddbd9&color_dots=#0d1b2a,#0e3a5c,#1b6ca8,#2a9fd6,#3ddbd9
            dist/snake-light.svg?color_snake=#0e4d7a&color_dots=#ebedf0,#b8e6f0,#6cc6dd,#2a9fd6,#0e4d7a
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
