name: snake
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#ffb3dd&color_dots=#161b22,#3b4a7a,#7a9cff,#b5c8ff,#ffd1ec
            dist/snake-light.svg?color_snake=#ff8cc8&color_dots=#ebedf0,#d6e9ff,#b5c8ff,#9aa8ff,#7a9cff
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
